name: Publish to PyPI

# Runs when you publish a GitHub Release (e.g. tag v1.0.0).
on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # report every Python/Django combination, not just the first failure
      matrix:
        include:
          - python: "3.10"
            django: "Django>=4.2,<5.0"
          - python: "3.12"
            django: "Django>=5.2,<6.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install "${{ matrix.django }}" -e ".[test]"
      - run: pytest
      - run: flake8 vtpass tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/django-vtpass/
    permissions:
      id-token: write  # required for PyPI Trusted Publishing; no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
